# Before the shared sign-in, HMS set its cookies on this host alone. The browser would send a
# stale host-only XSRF-TOKEN ahead of the shared one (failing every write with a 419), so
# app loads expire them. Only on the real domain: locally the host-only ones are the live ones.
map $host $old_hms_cookies {
    ~\.chickensplash\.dpdns\.org$ "1";
    default "";
}
map $old_hms_cookies $expire_xsrf {
    "1" "XSRF-TOKEN=; Path=/; Max-Age=0; Secure; SameSite=Lax";
}
map $old_hms_cookies $expire_session {
    "1" "hms-session=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax";
}
map $old_hms_cookies $expire_remember {
    "1" "remember_web_59ba36addc2b2f9401580f014c7f58ea4e30989d=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Upstreams resolve per request through Docker's DNS, so nginx still starts (and the
    # app still loads) while HMS is down or being recreated.
    resolver 127.0.0.11 valid=10s;

    include /etc/nginx/snippets/security-headers.conf;

    # The HMS API and Sanctum's CSRF cookie. The Host header is kept, so HMS sees the
    # public hostname, and the Origin header Sanctum checks passes through untouched.
    location ~ ^/(api|sanctum)/ {
        set $hms http://hms:3000;
        proxy_pass $hms;
        proxy_set_header Host $host;
        # cloudflared passes the visitor's IP in CF-Connecting-IP; HMS rate limits on it
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Cover art uploads in the studio.
        client_max_body_size 6m;
    }

    # Streams. HMS checks the session, then answers with X-Accel-Redirect to here, and nginx
    # sends the file (ranges and all) without holding up a PHP worker. Never reachable directly.
    location /_music/ {
        internal;
        alias /music/;
        types { audio/mpeg mp3; }
        default_type audio/mpeg;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # nginx's own MIME list doesn't know web app manifests.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Client-side routes all load the app.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        # Empty (so not sent at all) anywhere but the real domain, see the maps above.
        add_header Set-Cookie $expire_xsrf always;
        add_header Set-Cookie $expire_session always;
        add_header Set-Cookie $expire_remember always;
        try_files $uri /index.html;
    }
}
